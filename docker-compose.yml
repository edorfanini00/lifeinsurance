services:
  postgres:
    image: postgres:16-alpine
    container_name: lifey-postgres
    environment:
      POSTGRES_USER: lifey
      POSTGRES_PASSWORD: lifey
      POSTGRES_DB: lifey
    ports:
      - "5433:5432"
    volumes:
      - lifey_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifey -d lifey"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifey_pg:
